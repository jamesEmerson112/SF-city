name: openglassbox
channels:
  - defaults
  - conda-forge

dependencies:
  - python>=3.8
  - pygame>=2.0.0
  - typing-extensions>=4.0.0  # only needed for python<3.10

  # Development dependencies
  - pytest>=7.0
  - pytest-cov>=4.0
  - black>=22.0
  - flake8>=5.0
  - mypy>=1.0
  - isort>=5.0

  - pip:
    - -e ".[dev]"
