[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openglassbox"
version = "1.0.0"
description = "OpenGlassBox simulation engine - Python port with enhanced debug UI"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "jamesEmerson112", email = "james.emerson.vo.2503@gmail.com"}
]
maintainers = [
    {name = "jamesEmerson112", email = "james.emerson.vo.2503@gmail.com"}
]
keywords = ["simulation", "city", "pathfinding", "glassbox", "agent-based"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "black>=26.0",
    "flake8>=7.0",
    "mypy>=1.15",
    "isort>=6.0",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "myst-parser>=4.0",
]
performance = [
    "numpy>=2.0.0",
    "cython>=3.0.0",
]

[project.urls]
"Homepage" = "https://github.com/jamesEmerson112/OpenGlassBox-Python"
"Bug Reports" = "https://github.com/jamesEmerson112/OpenGlassBox-Python/issues"
"Source" = "https://github.com/jamesEmerson112/OpenGlassBox-Python"
"Upstream (C++)" = "https://github.com/Lecrapouille/OpenGlassBox"

[project.scripts]
openglassbox-demo = "demo.src.main:main"
openglassbox-run-demo = "demo.src.run_demo:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["openglassbox*", "demo*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
demo = [
    "data/Simulations/*.txt",
    "data/fonts/*.ttf",
    "data/textures/*.png",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["openglassbox"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pygame.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "performance: marks tests as performance benchmarks",
    "visual: marks tests that require visual verification",
]

[tool.coverage.run]
source = ["openglassbox"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == \"__main__\":",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
